<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diamondGrad1" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="diamondGrad2" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Top left facet -->
    <path d="M128 32 L48 100 L128 100 Z" fill="url(#diamondGrad1)" opacity="0.6"/>
    <!-- Top right facet -->
    <path d="M128 32 L208 100 L128 100 Z" fill="url(#diamondGrad1)" opacity="0.8"/>
    <!-- Bottom left facet -->
    <path d="M48 100 L128 224 L128 100 Z" fill="url(#diamondGrad2)" opacity="0.5"/>
    <!-- Bottom right facet -->
    <path d="M208 100 L128 224 L128 100 Z" fill="url(#diamondGrad2)" opacity="0.7"/>
    <!-- Center highlight -->
    <path d="M128 32 L160 100 L128 224 L96 100 Z" fill="#FFFFFF" opacity="0.1"/>
    <!-- Edges -->
    <path d="M128 32 L48 100 L128 224 L208 100 Z" stroke="#00FFFF" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M48 100 L208 100" stroke="#00FFFF" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M128 32 L128 224" stroke="#00FFFF" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
</svg>
